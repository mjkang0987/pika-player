# 표시 규칙
#   확인함  — 저장소에서 실제 존재를 확인한 안정 버전
#   미확인  — 추정값. 동기화에서 걸릴 수 있음
#
# 버전을 다시 확인하려면: bash tools/check_versions.sh
# (alpha/beta/rc 는 걸러서 안정 버전만 고를 것)
#
# AGP 9 로 올리면서 따라온 것:
#   - Gradle wrapper 8.14.3 → 9.7.1 (AGP 9 는 Gradle 9 를 요구한다)
#   - app/build.gradle.kts 의 kotlinOptions → kotlin { compilerOptions } 로 교체
#     (Kotlin 2.x 에서 kotlinOptions 는 없어졌다)

[versions]
agp = "9.3.2"               # 확인함. 8.x → 9.x 메이저 점프다 (아래 주석)
kotlin = "2.4.10"
coreKtx = "1.19.0"          # 확인함
lifecycle = "2.11.0"        # 확인함
activityCompose = "1.13.0"  # 확인함
composeBom = "2026.08.00"   # 확인함
media3 = "1.11.0"           # 확인함
room = "2.8.4"              # 확인함. 2.7+ 라야 KSP2 를 쓴다
datastore = "1.2.1"         # 확인함
coil = "2.7.0"
# 결제. 최신은 9.1.0 이지만 일부러 7.1.1 에 둔다.
# Billing 8.0 에서 queryProductDetailsAsync 의 콜백이 List<ProductDetails> 에서
# QueryProductDetailsResult 로 바뀌었다. BillingRepository 는 7.x API 로 쓰여 있고
# 이 환경에서는 어느 쪽도 컴파일해 볼 수 없다. 빌드가 한 번 통과한 뒤에 올리면
# 컴파일러가 무엇을 고쳐야 하는지 정확히 알려준다 — 그 순서가 안전하다.
# (Play 는 언젠가 8+ 를 요구하므로 출시 전에는 반드시 올려야 한다)
billing = "7.1.1"           # 최신은 9.1.0. 아래 주석 참고
# KSP2 부터 Kotlin 버전과 분리됐다. 예전 형식(2.2.21-2.0.5)은 2.2.x 까지만 있고,
# 그 뒤로는 독립 번호를 쓴다. Maven Central 에서 확인함.
ksp = "2.3.11"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
